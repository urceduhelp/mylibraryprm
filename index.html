    <button class="g" onclick="bAll(false)">තේරීම් ඉවත් කරන්න</button>

<dialog id="bibres" style="width:min(820px,95vw)">

  <div style="font-size:12px;color:var(--mu);margin:6px 0">* ස්වයංක්‍රීයව සකසන ලදී. දිනය, පිටු පරාසය වැනි දත්ත නොමැති නිසා ඇතැම් අංග අඩංගු නොවේ — අවශ්‍ය නම් පරීක්ෂා කර සකසන්න.</div>
  <div class="row"><button onclick="bibCopy()">📋 Copy</button><button class="g" onclick="$('bibres').close();$('bib').showModal()">← නැවත තෝරන්න</button><button class="g" onclick="$('bibres').close()">වසන්න</button></div>
</dialog>


<script>
const sb = supabase.createClient("https://jcijglwpkfluyzrltimk.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjaWpnbHdwa2ZsdXl6cmx0aW1rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY4MzU3OTUsImV4cCI6MjA4MjQxMTc5NX0.dvT8OiyVEiYn_DhkMakmSq1Vvr4REDr0kYPnyqCtWHs");
const $ = id => document.getElementById(id);
const HIDDEN_OK = true;
const bq = (cols, opt) => { const q = sb.from("books").select(cols, opt); return HIDDEN_OK ? q : q.eq("is_hidden", false); };
const cache = {};
const clean = v => { v = (v ?? "").toString().trim(); return v === "" ? null : v; };
const money = n => "Rs." + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const locOf = b => [b.book_number && "B-"+b.book_number, b.rack_number && "R-"+b.rack_number, b.shelf_number && "S-"+b.shelf_number].filter(Boolean).join(" | ");
/* valuation: මුද්‍රිත වර්ෂයේ සිට වර්ෂයකට GROWTH ප්‍රතිශතයකින් වැඩිවේ. COMPOUND=false නම් සරල (මුල් මිලෙන් 30%) */
const GROWTH = 0.05, COMPOUND = true, NOWY = new Date().getFullYear();
const NUM = ["price","print_year","pages"];
const numFix = o => { NUM.forEach(k => { if(o[k] !== null){ const n = parseFloat(o[k]); o[k] = isNaN(n) ? null : (k === "price" ? n : Math.round(n)); } }); return o; };
const hasAdj = b => b.price != null && Number(b.print_year) > 0 && Number(b.print_year) <= NOWY;
function adjVal(b){
  if(b.price == null) return null;
  if(!hasAdj(b)) return Number(b.price);
  const n = NOWY - Number(b.print_year), p = Number(b.price);
  return p * (COMPOUND ? Math.pow(1 + GROWTH, n) : 1 + GROWTH * n);
}

/* මූලාශ්‍ර වර්ග */
const SRC = ["ප්‍රාථමික මූලාශ්‍රය","ද්විතීයික මූලාශ්‍රය","වාර ප්‍රකාශන","පුවත්පත් ලිපි","වෙබ් අඩවියක පළ වූ ලිපි","කෝෂ ග්‍රන්ථ"];
const kindOf = t => ({"වාර ප්‍රකාශන":"per","පුවත්පත් ලිපි":"news","වෙබ් අඩවියක පළ වූ ලිපි":"web"})[t] || "book";

/* copy */
function toast(t){ const e = $("toast"); e.textContent = t; e.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add("hide"), 2200); }
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ const a = document.createElement("textarea"); a.value = t; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove(); }
  toast("Copy කළා ✔");
}
const bookLine = b => [b.title + (b.volume ? " (" + b.volume + ")" : ""), b.author, b.subject, b.publisher, b.print_year, b.pages != null && b.pages + " පිටු", b.isbn && "ISBN " + b.isbn, locOf(b), b.price != null && money(b.price), hasAdj(b) && "කාලීන " + money(adjVal(b))].filter(Boolean).join(" | ");
function copyBook(id){ copyText(bookLine(cache[id])); }
/* ===== මූලාශ්‍ර නාමාවලිය ===== */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const accDate = () => { const d = new Date(); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); };
const plain = h => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
const dot = h => /[.?!]$/.test(plain(h)) ? h : h + ".";
function cite(style, b){
  const kind = kindOf(b.source_type), t = v => (v ?? "").toString().trim();
  const au = t(b.author), T = t(b.title) || "(නම නැත)", V = t(b.volume), PUB = t(b.publisher), PL = t(b.pub_place), U = t(b.url);
  const Y = b.print_year ? String(b.print_year) : "n.d.", ACC = accDate();
  const A = esc(au), hasA = !!au, i = x => `<i>${esc(x)}</i>`, Tv = V ? T + ", " + V : T;
  const place = PL && PUB ? `${esc(PL)}: ${esc(PUB)}` : esc(PUB || PL);
  const art = kind === "per" || kind === "news", isPer = kind === "per";
  const avail = U ? ` Available at: ${esc(U)} (Accessed: ${ACC}).` : "";
  if(style === "harvard"){
    const cont = [PUB && i(PUB), isPer && V && esc(V)].filter(Boolean).join(", ");
    if(art) return (hasA ? `${A} (${Y}) ‘${esc(T)}’` : `‘${esc(T)}’ (${Y})`) + (cont ? ", " + cont : "") + "." + avail;
    if(kind === "web") return (hasA ? `${A} (${Y}) ${i(T)}` : `${i(T)} (${Y})`) + "." + (PUB ? ` ${esc(PUB)}.` : "") + avail;
    return (hasA ? `${A} (${Y}) ${i(Tv)}` : `${i(Tv)} (${Y})`) + "." + (place ? ` ${place}.` : "");
  }
  if(style === "apa"){
    const aj = (PUB || (isPer && V)) ? i([PUB, isPer && V].filter(Boolean).join(", ")) : "";
    if(art) return [hasA ? `${dot(A)} (${Y}). ${dot(esc(T))}` : `${dot(esc(T))} (${Y}).`, aj && dot(aj), U && esc(U)].filter(Boolean).join(" ");
    if(kind === "web") return [hasA ? `${dot(A)} (${Y}). ${dot(i(T))}` : `${dot(i(T))} (${Y}).`, PUB && dot(esc(PUB)), U && esc(U)].filter(Boolean).join(" ");
    return [hasA ? `${dot(A)} (${Y}). ${dot(i(Tv))}` : `${dot(i(Tv))} (${Y}).`, PUB && dot(esc(PUB))].filter(Boolean).join(" ");
  }
  const a = hasA ? dot(A) + " " : "";
  const qt = x => `“${esc(/[.?!]$/.test(x) ? x : x + ".")}”`;
  if(style === "chicago"){
    const c = PUB ? i(PUB) + (isPer && V ? " " + esc(V) : "") : (isPer && V ? esc(V) : "");
    if(art) return `${a}${qt(T)}` + (isPer ? (c ? " " + c : "") + ` (${Y}).` : ` ${c ? c + ", " : ""}${Y}.`) + (U ? ` ${esc(U)}.` : "");
    if(kind === "web") return `${a}${qt(T)}${PUB ? " " + esc(PUB) + "," : ""} ${Y}.` + (U ? ` ${esc(U)}.` : "") + (b.print_year ? "" : ` Accessed ${ACC}.`);
    return `${a}${dot(i(Tv))} ${place ? place + ", " : ""}${Y}.`;
  }
  /* mla */
  if(art) return `${a}${qt(T)} ${[PUB && i(PUB), isPer && V && esc(V), Y].filter(Boolean).join(", ")}.` + (U ? ` ${esc(U)}.` : "");
  if(kind === "web") return `${a}${qt(T)} ${[PUB && i(PUB), Y, U && esc(U)].filter(Boolean).join(", ")}. Accessed ${ACC}.`;
  return `${a}${dot(i(Tv))} ${[PUB && esc(PUB), Y].filter(Boolean).join(", ")}.`;
}
const BIB_STYLES = {harvard:"Harvard", chicago:"Chicago (Notes-Bibliography)", apa:"APA 7", mla:"MLA 9"};
let bibRows = [], bibSel = new Set(), bibStyle = "", bibShown = [], bibOut = {html:"", text:""};
async function openBib(st){
  if(!st) return;
  bibStyle = st; bibSel = new Set(); $("bq").value = "";
  $("bhead").textContent = "📑 " + BIB_STYLES[st] + " — පොත් තෝරන්න";
  $("blist").textContent = "load කරමින්..."; $("bcnt").textContent = ""; $("bib").showModal();
  const rows = [];
  for(let p = 0; ; p++){
    const {data, error} = await bq("id,title,volume,author,publisher,print_year,pub_place,url,source_type").order("id").range(p*1000, p*1000 + 999);
    if(error){ $("blist").textContent = error.message; return; }
    rows.push(...data); if(data.length < 1000) break;
  }
  bibRows = rows.sort((a, b) => String(a.title || "").localeCompare(String(b.title || ""), "si"));
  bibRender();
}
function bibRender(){
  const q = $("bq").value.trim().toLowerCase(), box = $("blist"), st = box.scrollTop;
  bibShown = bibRows.filter(r => !q || [r.title, r.author, r.publisher].some(x => String(x || "").toLowerCase().includes(q)));
  box.innerHTML = bibShown.slice(0, 400).map(r => `<div class="er"><label class="ck" style="flex:1"><input type="checkbox" ${bibSel.has(r.id) ? "checked" : ""} onchange="bTog(${r.id})">
    <span>${esc(r.title || "(නම නැත)")}${r.volume ? " — " + esc(r.volume) : ""} <small style="color:var(--mu)">${[r.author, r.source_type].filter(Boolean).map(esc).join(" · ")}</small></span></label></div>`).join("") || `<div style="color:var(--mu);padding:6px 0">කිසිවක් නැත</div>`;
  box.scrollTop = st; bibCount();
}
const bibCount = () => $("bcnt").textContent = `තෝරාගත් ${bibSel.size}ක් · පෙන්වන ${bibShown.length}ක්` + (bibShown.length > 400 ? " (පළමු 400 පමණක්, සෙවුමෙන් පටු කරන්න)" : "");
function bTog(id){ bibSel.has(id) ? bibSel.delete(id) : bibSel.add(id); bibCount(); }
function bAll(v){ bibShown.forEach(r => v ? bibSel.add(r.id) : bibSel.delete(r.id)); bibRender(); }
function bibBuild(rows, style){
  const groups = new Map(); let html = "", text = "";
  rows.forEach(b => { const k = SRC.includes(b.source_type) ? b.source_type : ""; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(b); });
  [...SRC, ""].forEach(k => {
    const list = groups.get(k); if(!list) return;
    const items = list.map(b => ({key:String(b.author || b.title || "").trim().replace(/^[\s"'“‘(]+/, ""), html:cite(style, b)})).sort((x, y) => x.key.localeCompare(y.key, "si"));
    const name = k || "වෙනත් / වර්ගය නොදක්වන ලද";
    html += `<h4 style="margin:14px 0 6px">${esc(name)}</h4>` + items.map(x => `<p style="margin:0 0 8px;padding-left:2em;text-indent:-2em">${x.html}</p>`).join("");
    text += name + "\n" + items.map(x => plain(x.html)).join("\n") + "\n\n";
  });
  return {html, text:text.trim()};
}
function bibOk(){
  if(!bibSel.size){ alert("අවම වශයෙන් පොතක් තෝරන්න."); return; }
  bibOut = bibBuild(bibRows.filter(r => bibSel.has(r.id)), bibStyle);
  $("brhead").textContent = `${BIB_STYLES[bibStyle]} — මූලාශ්‍ර නාමාවලිය (${bibSel.size})`;
  $("brbody").innerHTML = bibOut.html; $("bib").close(); $("bibres").showModal();
}
async function bibCopy(){
  try{ await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([bibOut.html], {type:"text/html"}), "text/plain":new Blob([bibOut.text], {type:"text/plain"})})]); toast("Copy කළා ✔"); }
  catch(e){ copyText(bibOut.text); }
}


const SIZE = 20, COLS = ["title","author","subject","publisher","isbn","book_number"];
let page = 0, type = "", vis = "", seq = 0, timer;

const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const terms = () => $("q").value.replace(/[,()%*_\\"']/g, " ").split(/\s+/).filter(Boolean);
function hl(s){
  let h = esc(s);
  terms().forEach(t => { const e = esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); h = h.replace(new RegExp("(" + e + ")(?![^<]*>)", "gi"), "<mark>$1</mark>"); });
  return h;
}

$("chips").innerHTML = ["", ...SRC].map(t => `<button class="chip${t ? "" : " on"}" data-t="${esc(t)}">${t ? esc(t) : "සියල්ල"}</button>`).join("");
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if(!b) return;
  type = b.dataset.t; page = 0;
  document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("on", c === b));
  load();
};
$("vis").onclick = e => {
  const b = e.target.closest(".chip"); if(!b) return;
  vis = b.dataset.v; page = 0;
  document.querySelectorAll("#vis .chip").forEach(c => c.classList.toggle("on", c === b));
  load();
};
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => { page = 0; load(); }, 300); });
$("prev").onclick = () => { if(page > 0){ page--; load(true); } };
$("next").onclick = () => { page++; load(true); };

function card(b){
  const rest = [b.author, b.publisher, b.print_year].filter(Boolean).map(hl).join(",");
  const title = hl(b.title) || "(නම නැත)";
  const line = (b.is_hidden ? `<span class="hb" title="Hide Book — පොදු පිටුවේ නොපෙන්වයි">🙈</span>` : "") + `<b>${title}${b.volume ? " (" + esc(b.volume) + ")" : ""}</b>` + (rest ? "- " + rest : "");
  const tip = [b.title, b.author, b.publisher, b.print_year, b.price != null && "මිල " + money(b.price), hasAdj(b) && "කාලීන " + money(adjVal(b))].filter(Boolean).join(", ");
  return `<article class="item${b.is_hidden ? " hid" : ""}">
    <div class="t" title="${esc(tip)}">${line}</div>
    <div class="r">${b.price != null ? `<span class="pr">${esc(money(b.price))}</span>` : ""}<span class="loc">${esc(locOf(b))}</span><button class="cp" onclick="copyBook(${b.id})">Copy</button></div>
  </article>`;
}

async function load(scroll){
  const my = ++seq, filtered = !!isFiltered();
  const {data, count, error} = await filt(bq("*", {count:"exact"})).order("title").order("id").range(page*SIZE, page*SIZE + SIZE - 1);
  if(my !== seq) return;
  if(error){ $("info").textContent = "දෝෂයක්: " + error.message; return; }
  data.forEach(b => cache[b.id] = b);
  const pages = Math.max(1, Math.ceil((count || 0) / SIZE));
  $("list").innerHTML = data.map(card).join("") || `<div class="empty">කිසිවක් හමු නොවීය. වෙනත් වචනයකින් හෝ වර්ගයකින් උත්සාහ කරන්න.</div>`;
  $("pg").textContent = `පිටුව ${page+1} / ${pages}`;
  $("prev").disabled = page === 0; $("next").disabled = page + 1 >= pages;
  const btn = ` <button class="b" onclick="copyResults()">📋 සියල්ල Copy</button>`;
  $("info").innerHTML = `<span>${filtered ? "ප්‍රතිඵල" : "සියලු පොත්"}: <b>${count ?? 0}</b></span>` + btn;
  if(filtered){ const t = await allSums(true); if(t && my === seq) $("info").innerHTML = `<span>${fmtTot("ප්‍රතිඵල", t)}</span>` + btn; }
  else if(TOT) $("info").innerHTML = `<span>${fmtTot("සියලු පොත්", TOT)}</span>` + btn;
  if(scroll) window.scrollTo({top:0, behavior:"smooth"});
}
const isFiltered = () => terms().length || type || (typeof vis !== "undefined" && vis);
const filt = qb => {
  terms().forEach(t => { qb = qb.or(COLS.map(c => `${c}.ilike.%${t}%`).join(",")); });
  if(type) qb = qb.eq("source_type", type);
  if(typeof vis !== "undefined" && vis) qb = qb.eq("is_hidden", vis === "hide");
  return qb;
};
let TOT = null;
const fmtTot = (label, t) => `${label}: <b>${t.n}</b> · මිල අනුව වටිනාකම: <b>${money(t.s)}</b> · කාලීන වටිනාකම: <b>${money(t.a)}</b>`;
async function allSums(filtered){
  const rows = [];
  for(let p = 0; ; p++){
    let q = bq("price,print_year,is_hidden"); if(filtered) q = filt(q);
    const {data, error} = await q.order("id").range(p*1000, p*1000 + 999);
    if(error || !data) return null; rows.push(...data); if(data.length < 1000) break;
  }
  return {n:rows.length, hid:rows.filter(r => r.is_hidden).length, s:rows.reduce((a, r) => a + (Number(r.price) || 0), 0), a:rows.reduce((a, r) => a + (adjVal(r) || 0), 0)};
}
async function copyResults(){
  toast("සූදානම් කරමින්...");
  const rows = [];
  for(let p = 0; ; p++){
    const {data, error} = await filt(bq("*")).order("title").order("id").range(p*1000, p*1000 + 999);
    if(error){ toast(error.message); return; }
    rows.push(...data); if(data.length < 1000) break;
  }
  copyText(rows.map((b, i) => (i+1) + ". " + bookLine(b)).join("\n"));
}
async function total(){
  const all = await sb.from("books").select("id", {count:"exact", head:true});
  const h = await sb.from("books").select("id", {count:"exact", head:true}).eq("is_hidden", true);
  $("stat").textContent = all.count != null ? `පොත් සහ මූලාශ්‍ර ${all.count}ක් (සැඟවූ ${h.count ?? 0}ක් ඇතුළුව)` : "";
}
/* Premium ප්‍රවේශය */
async function gate(){
  const {data} = await sb.auth.getSession(), ok = !!data.session;
  $("login").classList.toggle("hide", ok); $("app").classList.toggle("hide", !ok); $("out").classList.toggle("hide", !ok);
  if(ok){ load(); total(); } else $("stat").textContent = "සාමාජිකයන්ට පමණි";
}
async function signIn(){
  $("lmsg").textContent = "";
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if(error){ $("lmsg").textContent = "ඇතුල් විය නොහැක: " + error.message; return; }
  $("pw").value = ""; gate();
}
async function signOut(){ await sb.auth.signOut(); $("list").innerHTML = ""; gate(); }
gate();
</script>
